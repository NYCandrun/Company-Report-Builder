            {"id": "brand_guide", "path": "07-final-report/brand-guide.html", "required": true},
            {"id": "brief", "path": "05-synthesis/company-brief.md", "required": true}
          ],
          "outputs": ["07-final-report/diagram-style-spec.md", "07-final-report/01-product-capability-map.svg", "07-final-report/02-operating-model.svg", "07-final-report/03-enterprise-logical-architecture.svg", "07-final-report/04-technical-dependency-map.svg", "07-final-report/diagram-captions.md"],
