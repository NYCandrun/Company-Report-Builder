        },
        {
          "id": "visual",
          "task_type": "visual_review",
          "prompt": "prompts/phases/visual-review.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/writing.md"],
          "inputs": [
            {"id": "brief_artifacts", "path": "07-final-report/company-brief.{pdf,html}", "required": true},
            {"id": "brand_artifacts", "path": "07-final-report/brand-guide.{pdf,html}", "required": true},
