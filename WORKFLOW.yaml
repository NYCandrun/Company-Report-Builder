          "id": "brand-guide",
          "task_type": "brand_guide",
          "prompt": "prompts/phases/brand-guide.md",
          "cores": ["prompts/core/runtime.md"],
          "inputs": [
            {"id": "company_url", "kind": "runtime_value", "required": true},
            {"id": "scope_map", "path": "00-scope.md", "required": true}
