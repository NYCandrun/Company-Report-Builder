{
  "schema_version": "1.0.0",
  "source_of_truth": ["RESEARCH_CONSTITUTION.md", "WORKFLOW.yaml"],
  "runtime_entrypoint": "README.md",
  "legacy_traceability_source": "docs/legacy-prompt.md",
  "description": "Canonical executable phase and gate contract for company research.",
  "status_values": ["PASS", "FAIL", "UNKNOWN"],
  "disposition_values": ["completed", "completed_zero", "duplicate", "excluded", "blocked", "rejected"],
  "assurance_layers": {
    "data_integrity": "Structured research records are mechanically valid.",
    "evidence_validity": "Evidence supports the factual claim being used.",
    "reasoning_quality": "Valid facts justify the interpretation or conclusion.",
    "publication_integrity": "Reader-facing words and visuals stay within evidentiary support.",
    "execution_integrity": "Current evidence proves required work ran completely on current artifacts."
  },
  "global": {
    "fail_closed": true,
    "ledger": "tools/outputs/worker-ledger.jsonl",
    "gate_directory": "tools/outputs/gates",
    "reconciliation_directory": "tools/outputs/reconciliation",
    "validation_directory": "tools/outputs/validations",
    "test_directory": "tools/outputs/tests",
    "release_manifest": "07-final-report/release-manifest.json",
    "atomic_writes": true,
    "single_writer_shared_state": true,
    "required_language": "American English",
    "allowed_independent_preparation": [
      "verification tooling",
      "merge tooling",
      "filter spot-check tooling",
      "competitor capture",
      "design template",
      "rendering tools",
      "phase briefs",
      "work-list generation",
      "deterministic checks"
    ],
    "independent_role_pairs": [
      ["writer", "verification_reviewer"],
      ["synthesis_writer", "devils_advocate"],
      ["citation_placer", "citation_claim_reviewer"],
      ["page_author", "visual_reviewer"]
    ],
    "retry_policy": {
      "scope": "failed_or_unaccounted_inputs_only",
      "max_attempts_per_assignment": 2,
      "preserve_prior_attempts": true,
      "preserve_validated_outputs": true,
      "on_exhaustion": "blocked_or_unresolved"
    }
  },
