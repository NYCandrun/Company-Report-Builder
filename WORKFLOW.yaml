{
  "schema_version": "2.4.0",
  "source_of_truth": ["RESEARCH_CONSTITUTION.md", "WORKFLOW.yaml"],
  "runtime_entrypoint": "README.md",
  "description": "Canonical adaptive execution, shared transport cache, optional model routing, incremental publication, brand, diagram, phase, and gate contract for company research. Framework regression tests run in CI rather than inside company research runs.",
  "status_values": ["PASS", "FAIL", "UNKNOWN"],
  "disposition_values": ["completed", "completed_zero", "duplicate", "excluded", "blocked", "rejected"],
  "assurance_layers": {
    "data_integrity": "Structured research records are mechanically valid.",
    "evidence_validity": "Evidence supports the factual claim being used.",
    "reasoning_quality": "Valid facts justify the interpretation or conclusion.",
    "publication_integrity": "Reader-facing words and visuals stay within evidentiary support.",
    "execution_integrity": "Current evidence proves required work ran completely on current artifacts."
  },
  "global": {
    "fail_closed": true,
    "ledger": "tools/outputs/worker-ledger.jsonl",
    "gate_directory": "tools/outputs/gates",
    "reconciliation_directory": "tools/outputs/reconciliation",
    "validation_directory": "tools/outputs/validations",
    "release_manifest": "07-final-report/release-manifest.json",
    "atomic_writes": true,
    "single_writer_shared_state": true,
    "required_language": "American English",
    "allowed_independent_preparation": [
      "verification tooling",
      "merge tooling",
      "filter spot-check tooling",
      "competitor capture",
      "design template",
      "rendering tools",
      "phase briefs",
      "work-list generation",
      "deterministic checks"
    ],
    "independent_role_pairs": [
      ["writer", "verification_reviewer"],
      ["synthesis_writer", "devils_advocate"],
      ["citation_placer", "citation_claim_reviewer"],
      ["page_author", "visual_reviewer"]
    ],
    "retry_policy": {
      "scope": "failed_or_unaccounted_inputs_only",
      "max_attempts_per_assignment": 3,
      "preserve_prior_attempts": true,
      "preserve_validated_outputs": true,
      "on_exhaustion": "blocked_or_unresolved"
    }
  },
  "adaptive_runtime": {
    "database": "tools/outputs/runtime.sqlite3",
    "event_log": "tools/outputs/runtime-events.jsonl",
    "planner": "corpus_driven",
    "completion_basis": "question_sufficiency_or_saturation_not_source_count",
    "scheduler": {
      "concurrency_policy": "defaults only; the orchestrator tunes agent and runtime concurrency to whatever is most efficient in the current environment",
      "global_concurrency": 12,
      "per_host_concurrency": 2,
      "lease_seconds": 1800,
      "max_attempts": 3,
      "expired_lease_action": "targeted_retry"
    },
    "discovery": {
      "required_channels": ["company_site", "sitemaps", "newsroom_blog", "docs_help", "careers", "video", "podcasts", "social", "code_packages", "independent_web"],
      "first_party": "runtime crawl of the company host and its sitemaps to a fixed point",
      "search_channels": "close as sufficient when the admitted sources answer the named research questions, or saturated after repeated empty passes",
      "lead_only_hosts": "login-walled platforms are recorded as leads with provenance and are not captured",
      "saturation_empty_passes": 2,
      "min_host_interval_seconds": 1.0,
      "safety_circuit_breakers": {
        "max_pages": 10000,
        "max_bytes": 1000000000,
        "max_elapsed_seconds": 14400,
        "max_depth": 12
      },
      "on_circuit_breaker": "incomplete_never_complete"
    },
    "batching": {
      "target_extraction_tokens": 70000,
      "maximum_extraction_tokens": 90000,
      "split_oversize_sources": true
    },
    "model_routing": {
      "optional": true,
      "fallback": "use_available_model",
      "default_tier": "strong",
      "tiers": {
        "economy": {
          "model_class": "faster_capable",
          "effort": "low",
          "task_types": ["capture", "discovery_reducer", "capture_reducer", "extraction_reducer", "assembler"]
        },
        "standard": {
          "model_class": "balanced_capable",
          "effort": "medium",
          "task_types": ["source_discovery", "alternate_copies", "triage", "retriage", "filing", "filing_review", "language_review"]
        },
        "strong": {
          "model_class": "flagship_capable",
          "effort": "high",
          "task_types": []
        },
        "frontier": {
          "model_class": "strongest_available",
          "effort": "high",
          "task_types": ["verification", "devils_advocate", "diagram_modeler"]
        }
      }
    },
    "worker_outputs": "isolated_parts_then_single_writer_reducer",
    "runtime_executed_task_types": ["first-party discovery", "capture", "discovery_reducer", "capture_reducer", "extraction_reducer"],
    "early_dispatch": "a task marked dispatch=early starts as soon as its own dependencies are met; its phase gate still requires it"
  },
  "execution_profiles": {
    "bootstrap": {"automatic": true, "tasks": []},
    "scope": {
      "tasks": [
        {
          "id": "scope",
          "task_type": "scope",
          "prompt": "prompts/phases/scope.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["00-scope.md", "tools/outputs/input-classification.jsonl"],
          "independent": false,
          "exclusive_inputs": true
        }
      ]
    },
    "capture": {
      "tasks": [
        {
          "id": "capture",
          "task_type": "capture",
          "prompt": "prompts/phases/capture.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["01-sources/MANIFEST.csv", "01-sources/publish-dates.csv", "01-sources/BLOCKED.md", "06-checks/coverage.md", "tools/lists/extraction-scope.csv", "tools/outputs/capture-dispositions.jsonl"],
          "independent": false,
          "exclusive_inputs": true
        }
      ]
    },
    "facts": {
      "tasks": [
        {
          "id": "triage",
          "task_type": "triage",
          "prompt": "prompts/phases/triage.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "inputs": [
            {"id": "scope_map", "path": "00-scope.md", "required": true},
            {"id": "triage_index", "path": "tools/lists/triage-index.jsonl", "required": true},
            {"id": "source_manifest", "path": "01-sources/MANIFEST.csv", "required": true}
          ],
          "outputs": ["tools/lists/extraction-triage.jsonl"],
          "independent": true,
          "exclusive_inputs": true
        },
        {
          "id": "extract",
          "task_type": "extraction",
          "depends_on": ["triage"],
          "prompt": "prompts/phases/extraction.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["tools/candidates/all.jsonl", "tools/outputs/extraction-dispositions.jsonl"],
          "independent": false,
          "exclusive_inputs": true
        },
        {
          "id": "file-facts",
          "task_type": "filing",
          "prompt": "prompts/phases/filing.md",
          "depends_on": ["extract"],
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["02-facts/*.md", "tools/outputs/filing-dispositions.jsonl", "06-checks/script-audits.md", "tools/outputs/filing-spot-sample.json"],
          "independent": false,
          "exclusive_inputs": false,
          "metadata": {"single_writer": true, "executor": "runtime"}
        },
        {
          "id": "filing-spot-check",
          "task_type": "filing_review",
          "prompt": "prompts/phases/filing-spot-check.md",
          "depends_on": ["file-facts"],
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "inputs": [{"id": "spot_sample", "path": "tools/outputs/filing-spot-sample.json", "required": true}],
          "outputs": ["06-checks/duplicate-spot-check.md", "06-checks/filter-spot-check.md"],
          "independent": true,
          "exclusive_inputs": false
        }
      ]
    },
    "initial_synthesis": {
      "tasks": [
        {
          "id": "claim-digests",
          "task_type": "claim_digests",
          "prompt": "prompts/core/runtime.md",
          "inputs": [{"id": "fact_store", "path": "02-facts/*.md", "required": true}],
          "outputs": ["tools/digests/*.md"],
          "independent": false,
          "exclusive_inputs": false,
          "metadata": {"planner": "static-profile", "single_writer": true, "executor": "runtime"}
        },
        {
          "id": "groundwork",
          "task_type": "synthesis",
          "depends_on": ["claim-digests"],
          "prompt": "prompts/phases/synthesis-groundwork.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"],
          "inputs": [{"id": "claim_digests", "path": "tools/digests/*.md", "required": true}, {"id": "fact_store", "path": "02-facts/*.md", "required": true}, {"id": "scope_map", "path": "00-scope.md", "required": true}],
          "outputs": ["03-timelines/*.md", "tools/outputs/currency.csv"],
          "independent": false,
          "exclusive_inputs": true,
          "track_input_staleness": true
        },
        {"id": "write-product-map", "task_type": "synthesis", "depends_on": ["groundwork", "currency-review"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/product-map.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-offering", "task_type": "synthesis", "depends_on": ["groundwork", "currency-review"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/offering.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-customers-proof", "task_type": "synthesis", "depends_on": ["groundwork", "currency-review"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/customers-proof.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-competitors", "task_type": "synthesis", "depends_on": ["groundwork", "currency-review"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/competitors.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-glossary", "task_type": "synthesis", "depends_on": ["groundwork", "currency-review"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/glossary.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-messaging-timeline", "task_type": "synthesis", "depends_on": ["groundwork", "currency-review"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/messaging-timeline.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-organization", "task_type": "synthesis", "depends_on": ["groundwork", "currency-review"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/organization.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-direction", "task_type": "synthesis", "depends_on": ["groundwork", "currency-review"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/direction.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-inference-catalogue", "task_type": "synthesis", "depends_on": ["write-product-map", "write-offering", "write-customers-proof", "write-competitors", "write-glossary", "write-messaging-timeline", "write-organization", "write-direction"], "prompt": "prompts/phases/inference-catalogue.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/inference-catalogue.md"], "independent": true, "exclusive_inputs": false},
        {"id": "write-open-questions", "task_type": "synthesis", "depends_on": ["write-product-map", "write-offering", "write-customers-proof", "write-competitors", "write-glossary", "write-messaging-timeline", "write-organization", "write-direction", "write-inference-catalogue"], "prompt": "prompts/phases/synthesis.md", "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"], "outputs": ["05-synthesis/open-questions.md"], "independent": true, "exclusive_inputs": false},
        {
          "id": "currency-review",
          "task_type": "currency_review",
          "depends_on": ["groundwork"],
          "prompt": "prompts/phases/currency-review.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["06-checks/currency-review.md"],
          "independent": true,
          "exclusive_inputs": false
        }
      ]
    },
    "verification": {
      "tasks": [
        {
          "id": "verify-cited-facts",
          "task_type": "verification",
          "fan_out": "The runtime lists cited facts and writes one packet per fact (verification.prepare), groups them by source into shards that independent workers verify (verification.verify.SHARD, one part each), then merges the parts in cited order (verification.reduce-verdicts).",
          "prompt": "prompts/phases/verification.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["tools/lists/cited-facts.txt", "tools/outputs/cited-facts/index.json", "06-checks/verification-cited.md", "tools/outputs/verification-verdicts.jsonl"],
          "independent": true,
          "exclusive_inputs": true
        }
      ]
    },
    "corrected_synthesis": {
      "tasks": [
        {
          "id": "apply-verification",
          "task_type": "verification_fixer",
          "prompt": "prompts/phases/fixer.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"],
          "outputs": ["05-synthesis/*.md", "06-checks/verification-corrections.md", "tools/outputs/verification-corrections.jsonl"],
          "independent": true,
          "exclusive_inputs": true,
          "output_mode": "revise"
        }
      ]
    },
    "review": {
      "tasks": [
        {
          "id": "technical",
          "task_type": "technical_review",
          "prompt": "prompts/phases/review-technical.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["06-checks/review-technical.md", "tools/outputs/review-findings-technical.jsonl"],
          "independent": true,
          "exclusive_inputs": false
        },
        {
          "id": "devils-advocate",
          "task_type": "devils_advocate",
          "prompt": "prompts/phases/review-devils-advocate.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["06-checks/review-devils-advocate.md", "tools/outputs/review-findings-devils-advocate.jsonl"],
          "independent": true,
          "exclusive_inputs": false
        },
        {
          "id": "insider",
          "task_type": "insider_review",
          "prompt": "prompts/phases/review-insider.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["06-checks/review-insider.md", "tools/outputs/review-findings-insider.jsonl"],
          "independent": true,
          "exclusive_inputs": false
        },
        {
          "id": "editor",
          "task_type": "editor_review",
          "prompt": "prompts/phases/review-editor.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"],
          "outputs": ["06-checks/review-editor.md", "tools/outputs/review-findings-editor.jsonl"],
          "independent": true,
          "exclusive_inputs": false
        },
        {
          "id": "apply-review",
          "task_type": "fixer",
          "prompt": "prompts/phases/fixer.md",
          "depends_on": ["technical", "devils-advocate", "insider", "editor"],
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md", "prompts/core/writing.md"],
          "outputs": ["05-synthesis/{product-map,offering,customers-proof,competitors,glossary,messaging-timeline,organization,direction,inference-catalogue,open-questions}.md", "06-checks/review-decisions.md", "tools/outputs/review-decisions.jsonl"],
          "independent": true,
          "exclusive_inputs": true,
          "output_mode": "revise"
        }
      ]
    },
    "final": {
      "tasks": [
