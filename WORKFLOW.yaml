    "publication_checks": {
      "tasks": [
        {
          "id": "language",
          "task_type": "language_review",
          "prompt": "prompts/phases/language-review.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/writing.md"],
          "outputs": ["06-checks/american-english.md", "tools/outputs/publication-findings-language.jsonl"],
