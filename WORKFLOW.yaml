          "task_type": "citation_claim_review",
          "prompt": "prompts/phases/citation-review.md",
          "cores": ["prompts/core/runtime.md", "prompts/core/evidence.md"],
          "outputs": ["06-checks/citation-claims-b.md", "tools/outputs/citation-check-b.md", "tools/outputs/exhibit-citation-check.md", "tools/outputs/publication-findings-citation-b.jsonl"],
