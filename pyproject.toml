[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-research-control"
version = "2.0.0"
description = "Adaptive agent-native company research orchestrator with deterministic release controls"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
researchctl = "research_control.cli:main"

[tool.setuptools.packages.find]
include = ["research_control*"]
