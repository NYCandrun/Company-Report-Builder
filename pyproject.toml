[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-research-control"
version = "1.1.0"
description = "Agent-native company research workflow with deterministic release controls"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
researchctl = "research_control.cli:main"

[tool.setuptools.packages.find]
include = ["research_control*"]
